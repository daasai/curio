name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18
      - run: npm ci
      - run: npm run test:credential-safety
      # The product database is intentionally not versioned. Build an ephemeral
      # schema and seed it from the versioned CSV before read-only auditing.
      - run: DB_URL=./data/curio.db npm run db:push
      - run: npm run db:seed
      - run: npm run audit:vocab
      - run: npm run test:vocab-audit
      - run: npm run test:vocab-manual-decisions
      - run: npm run test:content
      - run: npm run test:api
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
